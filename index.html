<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ASHEN BLADE — v0.2</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090a0f;
    font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
    touch-action: none;
    color: #e6e1d6;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ВЕРХНИЙ HUD */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .player-stats {
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: rgba(12, 13, 18, 0.84);
    border: 1px solid rgba(196, 164, 108, 0.4);
    padding: 8px 12px;
    border-radius: 8px;
    min-width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }
  .hp-bar-wrap {
    width: 100%;
    height: 11px;
    background: #1f1417;
    border: 1px solid #5a383e;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  #hp-Lag {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: #e09f24;
    width: 100%;
    transition: width 0.4s ease-out;
  }
  #hp-Fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, #8f1d2c, #e0384b);
    width: 100%;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.7px;
    color: #c4a46c;
    font-weight: 700;
  }
  .relics-bar {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .relic-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(196, 164, 108, 0.16);
    border: 1px solid rgba(196, 164, 108, 0.45);
    color: #f0dbb0;
  }

  .room-badge {
    background: rgba(12, 13, 18, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 14px;
    border-radius: 8px;
    text-align: right;
  }
  .room-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: #c4a46c;
    text-transform: uppercase;
  }
  .room-sub {
    font-size: 11px;
    color: #9ba0ab;
    margin-top: 2px;
  }

  /* ТАЧ-КОНТРОЛЛЕР */
  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
  }
  #stick-zone {
    width: 155px;
    height: 155px;
    position: relative;
    pointer-events: auto;
  }
  .stick-base {
    position: absolute;
    left: 50%; top: 50%;
    width: 118px; height: 118px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid rgba(196, 164, 108, 0.38);
    background: radial-gradient(circle, rgba(196, 164, 108, 0.1) 0%, rgba(10, 10, 14, 0.5) 100%);
  }
  #stick-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 48px; height: 48px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ebd4aa 0%, #9c7a44 100%);
    box-shadow: 0 0 14px rgba(196, 164, 108, 0.55);
  }

  .action-buttons {
    position: relative;
    width: 230px;
    height: 165px;
    pointer-events: auto;
  }
  .act-btn {
    position: absolute;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    letter-spacing: 0.7px;
    color: #f5efe6;
    border: 2px solid rgba(255, 255, 255, 0.28);
    transition: transform 0.05s;
  }
  .act-btn:active, .act-btn.pressed {
    transform: scale(0.88);
    filter: brightness(1.3);
  }
  #btn-atk {
    width: 82px; height: 82px;
    right: 68px; bottom: 6px;
    background: radial-gradient(circle, rgba(196, 52, 68, 0.78), rgba(80, 18, 28, 0.9));
    border-color: #e05364;
    box-shadow: 0 0 20px rgba(224, 83, 100, 0.45);
    font-size: 13px;
  }
  #btn-jmp {
    width: 72px; height: 72px;
    right: 0px; bottom: 58px;
    background: radial-gradient(circle, rgba(72, 130, 180, 0.72), rgba(24, 48, 72, 0.9));
    border-color: #6ab0e8;
    font-size: 11px;
  }
  #btn-dash {
    width: 64px; height: 64px;
    right: 148px; bottom: 48px;
    background: radial-gradient(circle, rgba(196, 164, 108, 0.72), rgba(64, 50, 28, 0.9));
    border-color: #d8b878;
    font-size: 11px;
  }
  #btn-parry {
    width: 60px; height: 60px;
    right: 82px; bottom: 96px;
    background: radial-gradient(circle, rgba(120, 140, 180, 0.75), rgba(35, 42, 60, 0.9));
    border-color: #9ab4e8;
    font-size: 10px;
  }
  #btn-use {
    width: 64px; height: 64px;
    right: 12px; bottom: 130px;
    background: radial-gradient(circle, rgba(90, 185, 130, 0.85), rgba(25, 65, 42, 0.95));
    border-color: #68e09c;
    font-size: 11px;
    display: none;
    box-shadow: 0 0 18px rgba(104, 224, 156, 0.6);
  }

  /* МОДАЛКА ВЫБОРА РЕЛИКВИИ */
  #relic-modal {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(8, 9, 12, 0.9);
    backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #c4a46c;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .modal-sub {
    font-size: 12px;
    color: #9296a0;
    margin-bottom: 18px;
  }
  .cards-row {
    display: flex;
    gap: 14px;
    max-width: 680px;
    width: 100%;
    justify-content: center;
  }
  .relic-card {
    flex: 1;
    background: linear-gradient(180deg, #181a22 0%, #101218 100%);
    border: 1px solid #c4a46c;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    pointer-events: auto;
    text-align: left;
  }
  .relic-card:active {
    transform: scale(0.95);
  }
  .relic-card h4 {
    color: #f0dbb0;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .relic-card p {
    color: #a6aab5;
    font-size: 12px;
    line-height: 1.35;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="top-row">
    <div class="player-stats">
      <div class="meta-row">
        <span>ПЕПЕЛЬНЫЙ СТРАЖ</span>
        <span id="hp-txt">100 / 100</span>
      </div>
      <div class="hp-bar-wrap">
        <div id="hp-Lag"></div>
        <div id="hp-Fill"></div>
      </div>
      <div class="meta-row">
        <span id="atk-txt">УРОН: 24</span>
        <span id="souls-txt">ПЕПЕЛ: 0</span>
      </div>
      <div class="relics-bar" id="relics-list"></div>
    </div>

    <div class="room-badge">
      <div class="room-title" id="room-name">ЗАЛ 1 — ЦИТАДЕЛЬ ПЕПЛА</div>
      <div class="room-sub" id="room-status">Врагов в зале: 0</div>
    </div>
  </div>

  <div class="controls-row">
    <div id="stick-zone">
      <div class="stick-base"></div>
      <div id="stick-knob"></div>
    </div>

    <div class="action-buttons">
      <div class="act-btn" id="btn-use">ВЗЯТЬ</div>
      <div class="act-btn" id="btn-parry">ЩИТ</div>
      <div class="act-btn" id="btn-dash">РЫВОК</div>
      <div class="act-btn" id="btn-jmp">ПРЫЖОК</div>
      <div class="act-btn" id="btn-atk">УДАР</div>
    </div>
  </div>
</div>

<div id="relic-modal">
  <div class="modal-title">АЛТАРЬ ПРЕДКОВ</div>
  <div class="modal-sub">Выбери один дар для своего клинка</div>
  <div class="cards-row" id="cards-container"></div>
</div>

<script>
// =====================================================
// 1. ЗВУКОВОЙ ДВИЖОК (МЕТАЛЛ, ПАРИРОВАНИЕ, УДАРЫ)
// =====================================================
class AudioEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  slash(step = 1) {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(step === 3 ? 180 : 280, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.11);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.12);
  }
  hit(isCrit = false) {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = isCrit ? 'square' : 'triangle';
    osc.frequency.setValueAtTime(isCrit ? 150 : 115, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.15);
    gain.gain.setValueAtTime(isCrit ? 0.3 : 0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.16);
  }
  parryClang() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(920, now);
    osc.frequency.exponentialRampToValueAtTime(1480, now + 0.08);
    osc.frequency.exponentialRampToValueAtTime(440, now + 0.28);
    gain.gain.setValueAtTime(0.32, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.3);
  }
  jump() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(340, now + 0.09);
    gain.gain.setValueAtTime(0.11, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }
  dash() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(75, now + 0.13);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.14);
  }
}
const sfx = new AudioEngine();

// =====================================================
// 2. ПУЛ РЕЛИКВИЙ
// =====================================================
const RELIC_POOL = [
  { id: 'vamp', name: 'Окровавленный клык', desc: '+5 HP за каждого убитого врага.', apply: (p) => { p.vampOnKill += 5; } },
  { id: 'crit', name: 'Обсидиановая грань', desc: '+25% к шансу критического удара (x1.8 урона).', apply: (p) => { p.critChance += 0.25; } },
  { id: 'heavy', name: 'Печать Палача', desc: 'Урон меча +30%, длина клинка +16px.', apply: (p) => { p.dmg = Math.round(p.dmg * 1.3); p.rangeBonus += 16; } },
  { id: 'swift', name: 'Ртутная поступь', desc: 'Скорость бега +20%, откат рывка быстрее на 35%.', apply: (p) => { p.moveSpeed *= 1.2; p.dashCdMax *= 0.65; } },
  { id: 'vital', name: 'Сердце Гаргульи', desc: 'Макс. HP +40 и исцеление на 40 HP.', apply: (p) => { p.maxHp += 40; p.hp = Math.min(p.maxHp, p.hp + 40); } },
  { id: 'shock', name: 'Грозовой пепел', desc: 'Финальный удар комбо и парирование бьют молнией.', apply: (p) => { p.chainLightning = true; } }
];

// =====================================================
// 3. ХОЛСТ И МАСШТАБ КАМЕРЫ
// =====================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

const VIEW_H = 500;

// =====================================================
// 4. УПРАВЛЕНИЕ
// =====================================================
const input = {
  x: 0, y: 0,
  jumpHeld: false,
  jumpBuffer: 0,
  atkBuffered: false,
  dashBuffered: false,
  parryBuffered: false,
  usePressed: false
};

const stickZone = document.getElementById('stick-zone');
const stickKnob = document.getElementById('stick-knob');
let stickTouchId = null;

stickZone.addEventListener('pointerdown', (e) => {
  stickTouchId = e.pointerId;
  updateStick(e);
});
window.addEventListener('pointermove', (e) => {
  if (e.pointerId === stickTouchId) updateStick(e);
});
function releaseStick(e) {
  if (e.pointerId === stickTouchId) {
    stickTouchId = null;
    input.x = 0; input.y = 0;
    stickKnob.style.transform = `translate(-50%, -50%)`;
  }
}
window.addEventListener('pointerup', releaseStick);
window.addEventListener('pointercancel', releaseStick);

function updateStick(e) {
  const rect = stickZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const maxR = 46;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, maxR);
  const ang = Math.atan2(dy, dx);
  const kx = Math.cos(ang) * clamped;
  const ky = Math.sin(ang) * clamped;
  stickKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;

  const nx = kx / maxR;
  const ny = ky / maxR;
  input.x = Math.abs(nx) > 0.16 ? Math.sign(nx) * Math.min(1, (Math.abs(nx) - 0.14) / 0.7) : 0;
  input.y = Math.abs(ny) > 0.4 ? Math.sign(ny) : 0;
}

function bindBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.classList.add('pressed');
    onDown();
  });
  const end = () => {
    el.classList.remove('pressed');
    if (onUp) onUp();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
}

bindBtn('btn-jmp', () => { input.jumpHeld = true; input.jumpBuffer = 0.15; }, () => { input.jumpHeld = false; });
bindBtn('btn-atk', () => { input.atkBuffered = true; });
bindBtn('btn-dash', () => { input.dashBuffered = true; });
bindBtn('btn-parry', () => { input.parryBuffered = true; });
bindBtn('btn-use', () => { input.usePressed = true; });

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.x = -1;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') input.x = 1;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') input.y = 1;
  if (e.code === 'Space' || e.code === 'KeyW') {
    if (!input.jumpHeld) input.jumpBuffer = 0.15;
    input.jumpHeld = true;
  }
  if (e.code === 'KeyJ') input.atkBuffered = true;
  if (e.code === 'KeyK') input.parryBuffered = true;
  if (e.code === 'ShiftLeft' || e.code === 'KeyL') input.dashBuffered = true;
  if (e.code === 'KeyE') input.usePressed = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') if (input.x < 0) input.x = 0;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') if (input.x > 0) input.x = 0;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') input.y = 0;
  if (e.code === 'Space' || e.code === 'KeyW') input.jumpHeld = false;
});

// =====================================================
// 5. ИГРОВОЙ МИР, ИГРОК И ГЕНЕРАЦИЯ ЗАЛОВ
// =====================================================
let hitstopTimer = 0;
const cam = { x: 0, y: 0, shake: 0 };

const player = {
  x: 140, y: 350, w: 26, h: 46,
  vx: 0, vy: 0,
  facing: 1,
  grounded: false,
  coyoteTimer: 0,
  wallDir: 0,
  moveSpeed: 320,
  hp: 100, maxHp: 100,
  dmg: 24,
  critChance: 0.15,
  vampOnKill: 0,
  rangeBonus: 0,
  chainLightning: false,
  souls: 0,
  relics: [],
  comboStep: 0,
  comboWindow: 0,
  atkTimer: 0,
  downSmash: false,
  dashTimer: 0,
  dashCd: 0,
  dashCdMax: 0.6,
  parryWindow: 0,
  parryCd: 0,
  invuln: 0,
  animTime: 0,
  scarf: []
};
for (let i = 0; i < 6; i++) player.scarf.push({ x: player.x, y: player.y });

let roomIndex = 1;
let roomWidth = 2200;
const FLOOR_Y = 440;
let platforms = [];
let enemies = [];
let particles = [];
let ashFlakes = [];
let torches = [];
let slashArcs = [];
let floatTexts = [];
let shrine = null;
let portal = null;
let bgPillars = [];

// Падающий атмосферный пепел
for (let i = 0; i < 45; i++) {
  ashFlakes.push({
    x: Math.random() * 2000,
    y: Math.random() * 500,
    r: 1 + Math.random() * 2,
    vx: -15 - Math.random() * 20,
    vy: 18 + Math.random() * 25
  });
}

function resetScarf() {
  for (let i = 0; i < player.scarf.length; i++) {
    player.scarf[i].x = player.x + player.w / 2 - player.facing * i * 4;
    player.scarf[i].y = player.y + 12;
  }
}

function spawnParticles(x, y, color, count = 12, speed = 220, gravity = 500) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.3 + Math.random() * 0.8) * speed;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 60,
      size: 2.5 + Math.random() * 4,
      color,
      gravity,
      life: 0.3 + Math.random() * 0.35,
      maxLife: 0.65
    });
  }
}

function addFloatText(x, y, text, color = '#f5efe6', big = false) {
  floatTexts.push({ x, y, text, color, big, vy: -85, life: 0.8 });
}

function generateRoom(num) {
  roomIndex = num;
  platforms = [];
  enemies = [];
  particles = [];
  slashArcs = [];
  bgPillars = [];
  torches = [];

  roomWidth = 1850 + num * 180;

  // Каменный пол и боковые стены
  platforms.push({ x: -160, y: FLOOR_Y, w: roomWidth + 320, h: 240, type: 'floor' });
  platforms.push({ x: -120, y: -400, w: 120, h: 1000, type: 'wall' });
  platforms.push({ x: roomWidth, y: -400, w: 120, h: 1000, type: 'wall' });

  // Готические колонны и горящие факелы
  for (let x = 140; x < roomWidth - 100; x += 240) {
    bgPillars.push({ x, w: 54, h: 500 });
    torches.push({ x: x + 27, y: FLOOR_Y - 135, flicker: Math.random() * 10 });
  }

  // Генерация платформ, башен для Wall-Jump и врагов
  let cursorX = 320;
  while (cursorX < roomWidth - 400) {
    const pat = Math.floor(Math.random() * 3);
    if (pat === 0) {
      platforms.push({ x: cursorX, y: FLOOR_Y - 110, w: 190, h: 20, type: 'plat' });
      platforms.push({ x: cursorX + 95, y: FLOOR_Y - 220, w: 165, h: 20, type: 'plat' });
      spawnEnemyAt(cursorX + 80, FLOOR_Y - 110, num);
      cursorX += 340;
    } else if (pat === 1) {
      // Колонна для отскока от стены
      platforms.push({ x: cursorX + 35, y: FLOOR_Y - 230, w: 42, h: 230, type: 'wall' });
      platforms.push({ x: cursorX + 150, y: FLOOR_Y - 195, w: 175, h: 20, type: 'plat' });
      spawnEnemyAt(cursorX + 220, FLOOR_Y - 195, num);
      cursorX += 380;
    } else {
      platforms.push({ x: cursorX, y: FLOOR_Y - 135, w: 240, h: 22, type: 'plat' });
      spawnEnemyAt(cursorX + 110, FLOOR_Y - 135, num);
      spawnEnemyAt(cursorX + 160, FLOOR_Y, num);
      cursorX += 350;
    }
    if (Math.random() < 0.85) spawnEnemyAt(cursorX - 110, FLOOR_Y, num);
  }

  shrine = { x: Math.floor(roomWidth * 0.48), y: FLOOR_Y, used: false };
  portal = { x: roomWidth - 130, y: FLOOR_Y };

  // Спавн строго НАД полом, чтобы исключить проваливание!
  player.x = 110;
  player.y = FLOOR_Y - player.h - 4;
  player.vx = 0;
  player.vy = 0;
  player.grounded = true;
  player.downSmash = false;
  resetScarf();

  // Мгновенная центровка камеры на старте комнаты
  const scale = H / VIEW_H;
  const viewW = W / scale;
  cam.x = Math.max(-40, player.x - viewW * 0.35);
  cam.y = FLOOR_Y - VIEW_H * 0.82;

  updateHUD();
}

function spawnEnemyAt(x, groundY, level) {
  const types = ['stalker', 'warden', 'wraith'];
  const type = types[Math.floor(Math.random() * types.length)];
  const isWarden = type === 'warden';
  const isWraith = type === 'wraith';

  const w = isWarden ? 36 : 26;
  const h = isWarden ? 54 : (isWraith ? 42 : 44);
  const maxHp = Math.round((isWarden ? 95 : (isWraith ? 55 : 65)) * (1 + (level - 1) * 0.25));

  enemies.push({
    type,
    x, y: groundY - h - 2, w, h,
    vx: 0, vy: 0,
    hp: maxHp, maxHp,
    dmg: Math.round((isWarden ? 24 : 15) * (1 + (level - 1) * 0.18)),
    facing: -1,
    state: 'chase',
    timer: 0,
    atkCooldown: 0.4,
    flashTimer: 0
  });
}

// =====================================================
// 6. БОЁВКА, ПАРИРОВАНИЕ И АЛТАРИ
// =====================================================
function performAttack() {
  input.atkBuffered = false;

  if (!player.grounded && input.y > 0.4) {
    player.downSmash = true;
    player.vy = 690;
    player.atkTimer = 0.35;
    sfx.slash(3);
    return;
  }

  if (player.comboWindow > 0) {
    player.comboStep = (player.comboStep % 3) + 1;
  } else {
    player.comboStep = 1;
  }

  const isFinisher = player.comboStep === 3;
  player.atkTimer = isFinisher ? 0.24 : 0.16;
  player.comboWindow = 0.55;
  player.vx = player.facing * (isFinisher ? 310 : 175);
  sfx.slash(player.comboStep);

  const reach = (isFinisher ? 80 : 62) + player.rangeBonus;
  const hitX = player.facing === 1 ? player.x + player.w * 0.4 : player.x + player.w * 0.6 - reach;
  const hitY = player.y - 10;
  const hitW = reach;
  const hitH = player.h + 18;

  slashArcs.push({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2,
    dir: player.facing,
    step: player.comboStep,
    radius: reach,
    life: 0.16,
    maxLife: 0.16
  });

  let hitAny = false;
  enemies.forEach(e => {
    if (rectOverlap(hitX, hitY, hitW, hitH, e.x, e.y, e.w, e.h)) {
      hitAny = true;
      const stunnedBonus = e.state === 'stunned' ? 1.8 : 1.0;
      const isCrit = isFinisher || e.state === 'stunned' || Math.random() < player.critChance;
      const dmg = Math.round(player.dmg * (isFinisher ? 1.45 : 1.0) * (isCrit ? 1.7 : 1.0) * stunnedBonus);
      damageEnemy(e, dmg, player.facing * (isFinisher ? 320 : 190), isCrit);

      if (isFinisher && player.chainLightning) {
        enemies.forEach(other => {
          if (other !== e && Math.hypot(other.x - e.x, other.y - e.y) < 220) {
            damageEnemy(other, Math.round(dmg * 0.6), player.facing * 150, false, '#6ab0e8');
          }
        });
      }
    }
  });

  if (hitAny) {
    hitstopTimer = isFinisher ? 0.06 : 0.032;
    cam.shake = isFinisher ? 8.5 : 4;
    if (navigator.vibrate) navigator.vibrate(isFinisher ? 35 : 15);
  }
}

function damageEnemy(e, dmg, knockVx, isCrit, customColor = null) {
  e.hp -= dmg;
  e.vx = knockVx;
  e.vy = -130;
  e.flashTimer = 0.12;
  if (e.state !== 'stunned' && (e.type !== 'warden' || isCrit)) {
    e.state = 'stagger';
    e.timer = 0.24;
  }

  sfx.hit(isCrit);
  spawnParticles(e.x + e.w / 2, e.y + e.h / 2, customColor || (isCrit ? '#ffbe42' : '#d93848'), isCrit ? 16 : 9, 260);
  addFloatText(e.x + e.w / 2, e.y - 8, isCrit ? `${dmg}!` : `${dmg}`, isCrit ? '#ffbe42' : '#f5efe6', isCrit);

  if (e.hp <= 0) {
    spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#9e1b28', 22, 320);
    player.souls += e.type === 'warden' ? 25 : 12;
    if (player.vampOnKill > 0) {
      player.hp = Math.min(player.maxHp, player.hp + player.vampOnKill);
      addFloatText(player.x, player.y - 12, `+${player.vampOnKill} HP`, '#68e09c');
    }
  }
}

function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

const relicModal = document.getElementById('relic-modal');
const cardsContainer = document.getElementById('cards-container');
let pausedForModal = false;

function openRelicModal() {
  pausedForModal = true;
  cardsContainer.innerHTML = '';
  const shuffled = [...RELIC_POOL].sort(() => Math.random() - 0.5).slice(0, 3);
  shuffled.forEach(rel => {
    const card = document.createElement('div');
    card.className = 'relic-card';
    card.innerHTML = `<h4>${rel.name}</h4><p>${rel.desc}</p>`;
    card.onclick = () => {
      rel.apply(player);
      player.relics.push(rel.name);
      shrine.used = true;
      pausedForModal = false;
      relicModal.style.display = 'none';
      spawnParticles(shrine.x, shrine.y - 30, '#c4a46c', 25, 260);
      updateHUD();
    };
    cardsContainer.appendChild(card);
  });
  relicModal.style.display = 'flex';
}

// =====================================================
// 7. ИСПРАВЛЕННАЯ ФИЗИКА И КОЛЛИЗИИ (БЕЗ ПРОВАЛА СКВОЗЬ ПОЛ)
// =====================================================
const GRAVITY = 1520;

function update(dt) {
  if (pausedForModal) return;
  if (hitstopTimer > 0) {
    hitstopTimer -= dt;
    return;
  }

  player.animTime += dt;
  if (input.jumpBuffer > 0) input.jumpBuffer -= dt;
  if (player.coyoteTimer > 0) player.coyoteTimer -= dt;
  if (player.atkTimer > 0) player.atkTimer -= dt;
  if (player.comboWindow > 0) player.comboWindow -= dt;
  if (player.dashTimer > 0) player.dashTimer -= dt;
  if (player.dashCd > 0) player.dashCd -= dt;
  if (player.parryWindow > 0) player.parryWindow -= dt;
  if (player.parryCd > 0) player.parryCd -= dt;
  if (player.invuln > 0) player.invuln -= dt;

  // 1. Парирование щитом (Parry)
  if (input.parryBuffered && player.parryCd <= 0 && player.dashTimer <= 0) {
    input.parryBuffered = false;
    player.parryWindow = 0.28;
    player.parryCd = 0.55;
    player.vx *= 0.2;
    sfx.slash(1);
  }
  input.parryBuffered = false;

  // 2. Рывок (Dash с неуязвимостью)
  if (input.dashBuffered && player.dashCd <= 0 && player.dashTimer <= 0) {
    input.dashBuffered = false;
    player.dashTimer = 0.18;
    player.dashCd = player.dashCdMax;
    player.invuln = 0.25;
    player.downSmash = false;
    if (input.x !== 0) player.facing = Math.sign(input.x);
    player.vx = player.facing * 680;
    player.vy = 0;
    sfx.dash();
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#c4a46c', 10, 160, 0);
  }
  input.dashBuffered = false;

  // 3. Атака мечом
  if (input.atkBuffered && player.atkTimer <= 0 && player.dashTimer <= 0) {
    performAttack();
  }

  // 4. Горизонтальная скорость
  if (player.dashTimer <= 0 && player.atkTimer <= 0 && player.parryWindow <= 0) {
    if (input.x !== 0) {
      player.facing = Math.sign(input.x);
      const targetVx = input.x * player.moveSpeed;
      player.vx += (targetVx - player.vx) * Math.min(1, dt * 18);
    } else {
      player.vx *= Math.pow(0.001, dt);
    }
  } else if (player.atkTimer > 0 && !player.downSmash) {
    player.vx *= Math.pow(0.02, dt);
  }

  // 5. Гравитация и Wall-Slide
  if (player.dashTimer <= 0) {
    let g = GRAVITY;
    if (player.vy < 0 && !input.jumpHeld) g *= 2.3;
    if (player.vy > 0) g *= 1.2;
    player.vy = Math.min(920, player.vy + g * dt);

    if (player.wallDir !== 0 && !player.grounded && player.vy > 105 && Math.sign(input.x) === player.wallDir) {
      player.vy = 105;
    }
  }

  // 6. Прыжок и Wall-Jump
  if (input.jumpBuffer > 0) {
    if (player.coyoteTimer > 0) {
      player.vy = -560;
      player.grounded = false;
      player.coyoteTimer = 0;
      input.jumpBuffer = 0;
      sfx.jump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#9296a0', 7, 120, 200);
    } else if (player.wallDir !== 0 && !player.grounded) {
      player.vy = -530;
      player.vx = -player.wallDir * 410;
      player.facing = -player.wallDir;
      player.wallDir = 0;
      input.jumpBuffer = 0;
      sfx.jump();
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#c4a46c', 9, 160, 200);
    }
  }

  // 7. ГОРИЗОНТАЛЬНОЕ ДВИЖЕНИЕ (проверяем только реальные стены выше стоп!)
  player.x += player.vx * dt;
  player.wallDir = 0;
  for (const p of platforms) {
    if (p.type === 'wall') {
      // Игнорируем нижние и верхние кромки в 4px, чтобы не цеплять пол как стену
      if (rectOverlap(player.x, player.y + 4, player.w, player.h - 8, p.x, p.y, p.w, p.h)) {
        if (player.vx > 0 || (player.x + player.w / 2 < p.x + p.w / 2)) {
          player.x = p.x - player.w;
          player.wallDir = 1;
        } else {
          player.x = p.x + p.w;
          player.wallDir = -1;
        }
        player.vx = 0;
      }
    }
  }

  // 8. ВЕРТИКАЛЬНОЕ ДВИЖЕНИЕ (Swept Landing — невозможно пробить пол!)
  const prevBottom = player.y + player.h;
  player.y += player.vy * dt;
  player.grounded = false;

  for (const p of platforms) {
    if (p.type === 'plat') {
      if (player.vy >= 0 && prevBottom <= p.y + 14 && !(input.y > 0.55) &&
          player.x + player.w > p.x + 2 && player.x < p.x + p.w - 2 &&
          player.y + player.h >= p.y && player.y + player.h <= p.y + 28) {
        landOn(p.y);
      }
    } else if (p.type === 'floor' || p.type === 'wall') {
      if (rectOverlap(player.x + 2, player.y, player.w - 4, player.h, p.x, p.y, p.w, p.h)) {
        if (player.vy >= 0 && prevBottom <= p.y + 24) {
          landOn(p.y);
        } else if (player.vy < 0 && player.y >= p.y + p.h - 24) {
          player.y = p.y + p.h;
          player.vy = 0;
        } else if (p.type === 'floor') {
          // Жёсткая защита: если каким-то образом оказались внутри основного пола, выталкиваем наверх
          landOn(p.y);
        }
      }
    }
  }

  // Аварийный возврат, если улетел ниже арены
  if (player.y > FLOOR_Y + 80) {
    player.y = FLOOR_Y - player.h - 2;
    player.vy = 0;
    player.grounded = true;
    resetScarf();
  }

  function landOn(surfaceY) {
    player.y = surfaceY - player.h;
    if (player.downSmash) {
      player.downSmash = false;
      cam.shake = 11;
      sfx.hit(true);
      spawnParticles(player.x + player.w / 2, surfaceY, '#e05364', 24, 340);
      enemies.forEach(e => {
        if (Math.abs((e.x + e.w / 2) - (player.x + player.w / 2)) < 140 && Math.abs((e.y + e.h) - surfaceY) < 65) {
          damageEnemy(e, Math.round(player.dmg * 1.6), Math.sign(e.x - player.x) * 320, true);
        }
      });
    }
    player.vy = 0;
    player.grounded = true;
    player.coyoteTimer = 0.12;
  }

  // Физика плаща с ограничением максимальной длины сегмента
  let leadX = player.x + player.w / 2 - player.facing * 5;
  let leadY = player.y + 11;
  player.scarf.forEach((node, idx) => {
    node.x += (leadX - node.x - player.facing * 5) * Math.min(1, dt * (24 - idx * 2));
    node.y += (leadY - node.y + Math.sin(performance.now() * 0.015 + idx) * 1.8) * Math.min(1, dt * 20);
    // Защита от растягивания на весь экран
    const dist = Math.hypot(node.x - leadX, node.y - leadY);
    if (dist > 16) {
      const ang = Math.atan2(node.y - leadY, node.x - leadX);
      node.x = leadX + Math.cos(ang) * 10;
      node.y = leadY + Math.sin(ang) * 10;
    }
    leadX = node.x; leadY = node.y;
  });

  // 9. ИИ Врагов и проверка ПАРИРОВАНИЯ
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) {
      enemies.splice(i, 1);
      continue;
    }
    if (e.flashTimer > 0) e.flashTimer -= dt;
    if (e.atkCooldown > 0) e.atkCooldown -= dt;

    const dx = (player.x + player.w / 2) - (e.x + e.w / 2);
    const dy = (player.y + player.h / 2) - (e.y + e.h / 2);
    const dist = Math.hypot(dx, dy);

    if (e.state === 'stunned' || e.state === 'stagger') {
      e.timer -= dt;
      e.vx *= Math.pow(0.01, dt);
      if (e.timer <= 0) e.state = 'chase';
    } else if (e.state === 'windup') {
      e.vx *= 0.85;
      e.timer -= dt;
      if (e.timer <= 0) {
        e.state = 'strike';
        e.timer = 0.16;
        e.vx = e.facing * (e.type === 'warden' ? 340 : 420);

        if (Math.abs(dx) < (e.type === 'warden' ? 76 : 60) && Math.abs(dy) < 52) {
          // ПРОВЕРКА УСПЕШНОГО ПАРИРОВАНИЯ ЩИТОМ!
          if (player.parryWindow > 0) {
            sfx.parryClang();
            hitstopTimer = 0.09;
            cam.shake = 12;
            e.state = 'stunned';
            e.timer = 2.0; // Оглушение на 2 секунды
            e.vx = -e.facing * 260;
            spawnParticles(player.x + player.w / 2 + player.facing * 14, player.y + 20, '#6ab0e8', 22, 320);
            addFloatText(e.x + e.w / 2, e.y - 16, 'ПАРИРОВАНИЕ!', '#6ab0e8', true);
            if (navigator.vibrate) navigator.vibrate([30, 20, 50]);
          } else {
            hurtPlayer(e.dmg, e.facing * 260);
          }
        }
      }
    } else if (e.state === 'strike') {
      e.timer -= dt;
      if (e.timer <= 0) {
        e.state = 'chase';
        e.atkCooldown = e.type === 'warden' ? 1.2 : 0.8;
      }
    } else {
      if (dist < 420) {
        e.facing = dx >= 0 ? 1 : -1;
        const spd = e.type === 'warden' ? 110 : (e.type === 'wraith' ? 200 : 160);
        if (Math.abs(dx) > 44) {
          e.vx += (e.facing * spd - e.vx) * dt * 8;
        } else if (e.atkCooldown <= 0 && Math.abs(dy) < 55) {
          e.state = 'windup';
          e.timer = e.type === 'warden' ? 0.52 : 0.38;
        }
      } else {
        e.vx *= 0.9;
      }
    }

    if (e.type !== 'wraith') {
      const prevEBottom = e.y + e.h;
      e.vy = Math.min(800, e.vy + GRAVITY * dt);
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      for (const p of platforms) {
        if (e.vy >= 0 && prevEBottom <= p.y + 18 &&
            e.x + e.w > p.x && e.x < p.x + p.w &&
            e.y + e.h >= p.y && e.y + e.h <= p.y + 30) {
          e.y = p.y - e.h;
          e.vy = 0;
        }
      }
      if (e.y > FLOOR_Y - e.h) {
        e.y = FLOOR_Y - e.h;
        e.vy = 0;
      }
    } else {
      e.x += e.vx * dt;
      const targetY = Math.min(FLOOR_Y - e.h - 10, player.y - 6);
      e.y += (targetY - e.y) * dt * 2.5;
    }
  }

  // 10. Взаимодействие с Алтарём и Вратами
  const useBtn = document.getElementById('btn-use');
  const nearShrine = shrine && !shrine.used && Math.hypot(player.x - shrine.x, (player.y + player.h) - shrine.y) < 75;
  const nearPortal = portal && enemies.length === 0 && Math.hypot(player.x - portal.x, (player.y + player.h) - portal.y) < 85;

  if (nearShrine || nearPortal) {
    useBtn.style.display = 'flex';
    useBtn.textContent = nearShrine ? 'ДАР' : 'ВРАТА';
    if (input.usePressed) {
      input.usePressed = false;
      if (nearShrine) openRelicModal();
      else if (nearPortal) generateRoom(roomIndex + 1);
    }
  } else {
    useBtn.style.display = 'none';
    input.usePressed = false;
  }

  // 11. Частицы и пепел
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.vy += pt.gravity * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = slashArcs.length - 1; i >= 0; i--) {
    slashArcs[i].life -= dt;
    if (slashArcs[i].life <= 0) slashArcs.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }

  // 12. Плавная камера с жёстким ограничением по полу
  const scale = H / VIEW_H;
  const viewW = W / scale;
  const targetCamX = Math.max(-60, Math.min(roomWidth - viewW + 60, player.x + player.w / 2 + player.facing * 55 - viewW / 2));
  const targetCamY = Math.min(FLOOR_Y - VIEW_H + 65, player.y - VIEW_H * 0.56);
  cam.x += (targetCamX - cam.x) * Math.min(1, dt * 8);
  cam.y += (targetCamY - cam.y) * Math.min(1, dt * 7);
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 28);

  updateHUD();
}

function hurtPlayer(dmg, knockVx) {
  if (player.invuln > 0) return;
  player.hp -= dmg;
  player.invuln = 0.65;
  player.vx = knockVx;
  player.vy = -200;
  cam.shake = 12;
  sfx.hit(true);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#d93848', 18, 260);
  addFloatText(player.x + player.w / 2, player.y - 10, `-${dmg}`, '#ff4d5e', true);
  if (navigator.vibrate) navigator.vibrate(100);

  if (player.hp <= 0) {
    player.hp = 100; player.maxHp = 100;
    player.dmg = 24; player.critChance = 0.15;
    player.vampOnKill = 0; player.rangeBonus = 0;
    player.chainLightning = false;
    player.relics = [];
    player.souls = 0;
    generateRoom(1);
  }
}

function updateHUD() {
  const pct = Math.max(0, (player.hp / player.maxHp) * 100);
  document.getElementById('hp-Fill').style.width = `${pct}%`;
  document.getElementById('hp-Lag').style.width = `${pct}%`;
  document.getElementById('hp-txt').textContent = `${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`;
  document.getElementById('atk-txt').textContent = `УРОН: ${player.dmg}`;
  document.getElementById('souls-txt').textContent = `ПЕПЕЛ: ${player.souls}`;
  document.getElementById('room-name').textContent = `ЗАЛ ${roomIndex} — ЦИТАДЕЛЬ ПЕПЛА`;
  document.getElementById('room-status').textContent = enemies.length > 0
    ? `Врагов в зале: ${enemies.length}`
    : `Зал очищен — Врата открыты!`;
  document.getElementById('relics-list').innerHTML = player.relics.map(r => `<span class="relic-tag">${r}</span>`).join('');
}

// =====================================================
// 8. ГОТИЧЕСКИЙ РЕНДЕР (АРКИ, ФАКЕЛЫ, РЫЦАРЬ, МОНСТРЫ)
// =====================================================
function render() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#090a10');
  grad.addColorStop(1, '#141722');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const scale = H / VIEW_H;
  ctx.save();
  ctx.scale(scale, scale);

  const sx = (Math.random() - 0.5) * cam.shake;
  const sy = (Math.random() - 0.5) * cam.shake;
  ctx.translate(-cam.x + sx, -cam.y + sy);

  const now = performance.now();

  // 1. Готические колонны и своды на фоне
  bgPillars.forEach(b => {
    const px = b.x - cam.x * 0.15;
    ctx.fillStyle = '#11131c';
    ctx.fillRect(px, -40, b.w, b.h);
    ctx.fillStyle = '#181b28';
    ctx.fillRect(px + 8, -40, 10, b.h);
    ctx.strokeStyle = '#222638';
    ctx.lineWidth = 2;
    ctx.strokeRect(px, -40, b.w, b.h);
  });

  // 2. Горящие факелы с мягким свечением
  torches.forEach(t => {
    const rad = 58 + Math.sin(now * 0.012 + t.flicker) * 7;
    const tGrad = ctx.createRadialGradient(t.x, t.y, 4, t.x, t.y, rad);
    tGrad.addColorStop(0, 'rgba(255, 165, 60, 0.35)');
    tGrad.addColorStop(1, 'rgba(255, 120, 30, 0)');
    ctx.fillStyle = tGrad;
    ctx.beginPath();
    ctx.arc(t.x, t.y, rad, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#3a2b22';
    ctx.fillRect(t.x - 3, t.y, 6, 18);
    ctx.fillStyle = '#ffae38';
    ctx.beginPath();
    ctx.arc(t.x, t.y - 3, 5 + Math.sin(now * 0.02 + t.flicker) * 1.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // 3. Алтарь Предков
  if (shrine) {
    ctx.fillStyle = shrine.used ? '#2b2d38' : '#c4a46c';
    ctx.beginPath();
    ctx.moveTo(shrine.x - 20, shrine.y);
    ctx.lineTo(shrine.x, shrine.y - 58);
    ctx.lineTo(shrine.x + 20, shrine.y);
    ctx.closePath();
    ctx.fill();
    if (!shrine.used) {
      ctx.fillStyle = 'rgba(196, 164, 108, 0.22)';
      ctx.beginPath();
      ctx.arc(shrine.x, shrine.y - 32, 36 + Math.sin(now * 0.006) * 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 4. Врата перехода
  if (portal) {
    const active = enemies.length === 0;
    ctx.strokeStyle = active ? '#68e09c' : '#3a3d4a';
    ctx.lineWidth = 5;
    ctx.strokeRect(portal.x - 24, portal.y - 78, 48, 78);
    if (active) {
      ctx.fillStyle = 'rgba(104, 224, 156, 0.25)';
      ctx.fillRect(portal.x - 20, portal.y - 74, 40, 74);
    }
  }

  // 5. Каменные платформы и плиты пола
  platforms.forEach(p => {
    ctx.fillStyle = p.type === 'plat' ? '#282c3a' : '#171922';
    ctx.fillRect(p.x, p.y, p.w, p.h);

    // Верхняя каменная кромка
    ctx.fillStyle = p.type === 'plat' ? '#4a5268' : '#2d3242';
    ctx.fillRect(p.x, p.y, p.w, 6);

    ctx.strokeStyle = p.type === 'plat' ? '#646e8a' : '#353a4d';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  });

  // 6. Отрисовка врагов (Силуэты, броня, оружие, статус оглушения)
  enemies.forEach(e => {
    ctx.save();
    if (e.state === 'windup') {
      ctx.strokeStyle = '#ffbe42';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(e.x + e.w / 2, e.y - 12, 8, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (e.state === 'stunned') {
      ctx.fillStyle = '#6ab0e8';
      ctx.font = '900 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ОГЛУШЁН', e.x + e.w / 2, e.y - 16);
    }

    // Тело монстра
    ctx.fillStyle = e.flashTimer > 0
      ? '#ffffff'
      : (e.type === 'warden' ? '#5e1d27' : (e.type === 'wraith' ? '#36566e' : '#3d3347'));
    ctx.fillRect(e.x, e.y + 8, e.w, e.h - 8);

    // Голова / рогатый шлем
    ctx.fillStyle = e.flashTimer > 0 ? '#ffffff' : '#26222e';
    ctx.fillRect(e.x + 4, e.y, e.w - 8, 14);

    // Светящийся глаз
    ctx.fillStyle = e.state === 'windup' ? '#ffbe42' : (e.state === 'stunned' ? '#6ab0e8' : '#ff2a44');
    const eyeX = e.facing === 1 ? e.x + e.w - 9 : e.x + 4;
    ctx.fillRect(eyeX, e.y + 5, 5, 4);

    // Полоска здоровья
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#181214';
      ctx.fillRect(e.x - 4, e.y - 9, e.w + 8, 4);
      ctx.fillStyle = '#e0384b';
      ctx.fillRect(e.x - 4, e.y - 9, (e.w + 8) * (e.hp / e.maxHp), 4);
    }
    ctx.restore();
  });

  // 7. Отрисовка Пепельного Стража (Плащ, доспех, шлем, клинок, щит)
  ctx.strokeStyle = '#a82030';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  player.scarf.forEach((n, idx) => {
    if (idx === 0) ctx.moveTo(n.x, n.y);
    else ctx.lineTo(n.x, n.y);
  });
  ctx.stroke();

  ctx.save();
  if (player.invuln > 0 && Math.floor(now / 45) % 2 === 0) ctx.globalAlpha = 0.45;

  const bob = player.grounded && Math.abs(player.vx) > 20 ? Math.sin(player.animTime * 18) * 2.5 : 0;

  // Ноги
  ctx.fillStyle = '#252834';
  ctx.fillRect(player.x + 4, player.y + 30, 7, 16);
  ctx.fillRect(player.x + 15, player.y + 30, 7, 16);

  // Кираса и наплечники
  ctx.fillStyle = player.dashTimer > 0 ? '#f0dbb0' : '#7b8296';
  ctx.fillRect(player.x + 2, player.y + 13 + bob, player.w - 4, 20);

  // Рыцарский шлем
  ctx.fillStyle = '#9aa2b8';
  ctx.fillRect(player.x + 4, player.y + bob, player.w - 8, 14);

  // Горящий визор
  ctx.fillStyle = '#00f3ff';
  const visorX = player.facing === 1 ? player.x + player.w - 10 : player.x + 4;
  ctx.fillRect(visorX, player.y + 5 + bob, 6, 3);

  // Клинок в руке
  ctx.strokeStyle = '#dce3f2';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  const handX = player.x + player.w / 2 + player.facing * 8;
  const handY = player.y + 22 + bob;
  ctx.moveTo(handX, handY);
  ctx.lineTo(handX + player.facing * 22, handY - 12);
  ctx.stroke();

  // Энергетический щит при парировании
  if (player.parryWindow > 0) {
    ctx.strokeStyle = '#6ab0e8';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(player.x + player.w / 2, player.y + player.h / 2, 32, -Math.PI * 0.45, Math.PI * 0.45, player.facing < 0);
    ctx.stroke();
  }
  ctx.restore();

  // 8. Дуги рассечения мечом
  slashArcs.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(s.dir, 1);
    const alpha = s.life / s.maxLife;
    ctx.strokeStyle = s.step === 3 ? `rgba(255, 190, 66, ${alpha})` : `rgba(235, 245, 255, ${alpha})`;
    ctx.lineWidth = s.step === 3 ? 14 : 9;
    ctx.beginPath();
    if (s.step === 2) {
      ctx.arc(0, 0, s.radius * 0.78, Math.PI * 0.65, -Math.PI * 0.55, true);
    } else {
      ctx.arc(0, 0, s.radius * 0.78, -Math.PI * 0.55, Math.PI * 0.55, false);
    }
    ctx.stroke();
    ctx.restore();
  });

  // 9. Частицы и цифры урона
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  });
  ctx.globalAlpha = 1;

  floatTexts.forEach(ft => {
    ctx.font = ft.big ? '900 17px sans-serif' : '700 13px sans-serif';
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  });

  ctx.restore();
}

generateRoom(1);
let prev = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - prev) / 1000);
  prev = now;
  update(dt);
  render();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
