<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ASHEN BLADE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07080c; font-family: 'Segoe UI', Roboto, sans-serif; touch-action: none; color: #e6e1d6; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

  #hud {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .player-stats {
    display: flex; flex-direction: column; gap: 5px;
    background: rgba(10, 11, 16, 0.88); border: 1px solid rgba(196, 164, 108, 0.45);
    padding: 8px 12px; border-radius: 6px; min-width: 230px; box-shadow: 0 4px 18px rgba(0,0,0,0.7);
  }
  .hp-bar-wrap { width: 100%; height: 12px; background: #1a1013; border: 1px solid #5a383e; border-radius: 2px; overflow: hidden; position: relative; }
  #hp-Lag { position: absolute; inset: 0; width: 100%; background: #e8a828; transition: width 0.4s ease-out; }
  #hp-Fill { position: absolute; inset: 0; width: 100%; background: linear-gradient(90deg, #8a1826, #e63246); }
  .meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 0.7px; color: #c4a46c; font-weight: 800; }
  .combo-dots { display: flex; gap: 4px; }
  .c-dot { width: 8px; height: 8px; border-radius: 2px; background: #282b36; border: 1px solid #555b70; }
  .c-dot.active { background: #ffbe42; border-color: #fff; box-shadow: 0 0 6px #ffbe42; }
  .relics-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .relic-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: rgba(196, 164, 108, 0.16); border: 1px solid rgba(196, 164, 108, 0.45); color: #f0dbb0; }

  .room-badge { background: rgba(10, 11, 16, 0.88); border: 1px solid rgba(196, 164, 108, 0.3); padding: 8px 14px; border-radius: 6px; text-align: right; }
  .room-title { font-size: 13px; font-weight: 900; letter-spacing: 1.4px; color: #c4a46c; text-transform: uppercase; }
  .room-sub { font-size: 11px; color: #9ba0ab; margin-top: 2px; }

  .controls-row { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
  #stick-zone { width: 155px; height: 155px; position: relative; pointer-events: auto; }
  .stick-base { position: absolute; left: 50%; top: 50%; width: 118px; height: 118px; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid rgba(196, 164, 108, 0.38); background: radial-gradient(circle, rgba(196, 164, 108, 0.1) 0%, rgba(10, 10, 14, 0.55) 100%); }
  #stick-knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, #ebd4aa 0%, #9c7a44 100%); box-shadow: 0 0 14px rgba(196, 164, 108, 0.55); }

  .action-buttons { position: relative; width: 235px; height: 165px; pointer-events: auto; }
  .act-btn { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; letter-spacing: 0.7px; color: #f5efe6; border: 2px solid rgba(255, 255, 255, 0.28); overflow: hidden; }
  .act-btn:active, .act-btn.pressed { transform: scale(0.88); filter: brightness(1.25); }
  .cd-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.68); height: 0%; pointer-events: none; }
  #btn-atk { width: 84px; height: 84px; right: 68px; bottom: 6px; background: radial-gradient(circle, rgba(196, 52, 68, 0.82), rgba(75, 16, 25, 0.92)); border-color: #e05364; font-size: 13px; }
  #btn-jmp { width: 72px; height: 72px; right: 0px; bottom: 58px; background: radial-gradient(circle, rgba(72, 130, 180, 0.76), rgba(24, 48, 72, 0.92)); border-color: #6ab0e8; font-size: 11px; }
  #btn-dash { width: 64px; height: 64px; right: 150px; bottom: 48px; background: radial-gradient(circle, rgba(196, 164, 108, 0.76), rgba(64, 50, 28, 0.92)); border-color: #d8b878; font-size: 11px; }
  #btn-parry { width: 60px; height: 60px; right: 84px; bottom: 98px; background: radial-gradient(circle, rgba(120, 140, 180, 0.78), rgba(35, 42, 60, 0.92)); border-color: #9ab4e8; font-size: 10px; }
  #btn-use { width: 64px; height: 64px; right: 12px; bottom: 132px; background: radial-gradient(circle, rgba(90, 185, 130, 0.88), rgba(25, 65, 42, 0.95)); border-color: #68e09c; font-size: 11px; display: none; }

  #relic-modal { position: absolute; inset: 0; z-index: 20; background: rgba(6, 7, 10, 0.92); backdrop-filter: blur(8px); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .modal-title { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #c4a46c; margin-bottom: 6px; }
  .modal-sub { font-size: 12px; color: #9296a0; margin-bottom: 18px; }
  .cards-row { display: flex; gap: 14px; max-width: 680px; width: 100%; justify-content: center; }
  .relic-card { flex: 1; background: linear-gradient(180deg, #181a22 0%, #0f1117 100%); border: 2px solid #c4a46c; border-radius: 8px; padding: 14px; pointer-events: auto; text-align: left; }
  .relic-card h4 { color: #f0dbb0; font-size: 14px; margin-bottom: 6px; }
  .relic-card p { color: #a6aab5; font-size: 12px; line-height: 1.35; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="top-row">
    <div class="player-stats">
      <div class="meta-row"><span>ПЕПЕЛЬНЫЙ СТРАЖ</span><span id="hp-txt">100 / 100</span></div>
      <div class="hp-bar-wrap"><div id="hp-Lag"></div><div id="hp-Fill"></div></div>
      <div class="meta-row">
        <span id="atk-txt">УРОН: 25</span>
        <div class="combo-dots"><div class="c-dot" id="cd-1"></div><div class="c-dot" id="cd-2"></div><div class="c-dot" id="cd-3"></div></div>
        <span id="souls-txt">ПЕПЕЛ: 0</span>
      </div>
      <div class="relics-bar" id="relics-list"></div>
    </div>
    <div class="room-badge">
      <div class="room-title" id="room-name">ЗАЛ 1 — ЦИТАДЕЛЬ ПЕПЛА</div>
      <div class="room-sub" id="room-status">Врагов в зале: 0</div>
    </div>
  </div>
  <div class="controls-row">
    <div id="stick-zone"><div class="stick-base"></div><div id="stick-knob"></div></div>
    <div class="action-buttons">
      <div class="act-btn" id="btn-use">ВЗЯТЬ</div>
      <div class="act-btn" id="btn-parry"><span>ЩИТ</span><div class="cd-overlay" id="cd-parry"></div></div>
      <div class="act-btn" id="btn-dash"><span>РЫВОК</span><div class="cd-overlay" id="cd-dash"></div></div>
      <div class="act-btn" id="btn-jmp"><span>ПРЫЖОК</span></div>
      <div class="act-btn" id="btn-atk"><span>УДАР</span><div class="cd-overlay" id="cd-atk"></div></div>
    </div>
  </div>
</div>
<div id="relic-modal">
  <div class="modal-title">АЛТАРЬ ПРЕДКОВ</div>
  <div class="modal-sub">Выбери древнюю реликвию</div>
  <div class="cards-row" id="cards-container"></div>
</div>

<!-- МОДУЛИ ИГРЫ -->
<script src="src/sprites.js"></script>
<script src="src/world.js"></script>
<script src="src/game.js"></script>
</body>
</html>
