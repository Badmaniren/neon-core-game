<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ASHEN BLADE — Roguelite Slasher v0.1</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0c10;
    font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
    touch-action: none;
    color: #e6e1d6;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ВЕРХНИЙ HUD */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .player-stats {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: rgba(14, 15, 20, 0.78);
    border: 1px solid rgba(196, 164, 108, 0.35);
    padding: 8px 12px;
    border-radius: 8px;
    min-width: 210px;
  }
  .hp-bar-wrap {
    width: 100%;
    height: 11px;
    background: #23191d;
    border: 1px solid #5a383e;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  #hp-Lag {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: #d99b26;
    width: 100%;
    transition: width 0.45s ease-out;
  }
  #hp-Fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, #8f1d2c, #d93848);
    width: 100%;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.8px;
    color: #c4a46c;
    font-weight: 700;
  }
  .relics-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .relic-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(196, 164, 108, 0.15);
    border: 1px solid rgba(196, 164, 108, 0.4);
    color: #f0dbb0;
  }

  .room-badge {
    background: rgba(14, 15, 20, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 14px;
    border-radius: 8px;
    text-align: right;
  }
  .room-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #c4a46c;
    text-transform: uppercase;
  }
  .room-sub {
    font-size: 11px;
    color: #9296a0;
    margin-top: 2px;
  }

  /* ТАЧ-КОНТРОЛЛЕР (ЛЕВЫЙ СТИК + ПРАВЫЙ БЛОК СЛЭШЕРА) */
  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
  }
  #stick-zone {
    width: 150px;
    height: 150px;
    position: relative;
    pointer-events: auto;
  }
  .stick-base {
    position: absolute;
    left: 50%; top: 50%;
    width: 116px; height: 116px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid rgba(196, 164, 108, 0.35);
    background: radial-gradient(circle, rgba(196, 164, 108, 0.08) 0%, rgba(10, 10, 14, 0.45) 100%);
  }
  #stick-knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 48px; height: 48px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #e8d0a5 0%, #9c7a44 100%);
    box-shadow: 0 0 14px rgba(196, 164, 108, 0.5);
  }

  .action-buttons {
    position: relative;
    width: 210px;
    height: 155px;
    pointer-events: auto;
  }
  .act-btn {
    position: absolute;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    letter-spacing: 0.8px;
    color: #f5efe6;
    border: 2px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(4px);
    transition: transform 0.06s;
  }
  .act-btn:active, .act-btn.pressed {
    transform: scale(0.88);
    filter: brightness(1.3);
  }
  /* Кнопка УДАРА — главная и крупная */
  #btn-atk {
    width: 82px; height: 82px;
    right: 68px; bottom: 8px;
    background: radial-gradient(circle, rgba(196, 52, 68, 0.72), rgba(80, 18, 28, 0.85));
    border-color: #e05364;
    box-shadow: 0 0 20px rgba(224, 83, 100, 0.4);
    font-size: 13px;
  }
  /* Кнопка ПРЫЖКА */
  #btn-jmp {
    width: 72px; height: 72px;
    right: 0px; bottom: 58px;
    background: radial-gradient(circle, rgba(72, 130, 180, 0.65), rgba(24, 48, 72, 0.85));
    border-color: #6ab0e8;
    font-size: 12px;
  }
  /* Кнопка ПЕРЕКАТА / РЫВКА */
  #btn-dash {
    width: 64px; height: 64px;
    right: 138px; bottom: 58px;
    background: radial-gradient(circle, rgba(196, 164, 108, 0.65), rgba(64, 50, 28, 0.85));
    border-color: #d8b878;
    font-size: 11px;
  }
  /* Кнопка ВЗАИМОДЕЙСТВИЯ (Алтари / Врата) */
  #btn-use {
    width: 58px; height: 58px;
    right: 78px; bottom: 98px;
    background: radial-gradient(circle, rgba(90, 185, 130, 0.75), rgba(25, 65, 42, 0.9));
    border-color: #68e09c;
    font-size: 11px;
    display: none;
    box-shadow: 0 0 16px rgba(104, 224, 156, 0.5);
  }

  /* МОДАЛКА ВЫБОРА РЕЛИКВИИ (РОГАЛИК) */
  #relic-modal {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(8, 9, 12, 0.88);
    backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #c4a46c;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .modal-sub {
    font-size: 12px;
    color: #9296a0;
    margin-bottom: 18px;
  }
  .cards-row {
    display: flex;
    gap: 14px;
    max-width: 680px;
    width: 100%;
    justify-content: center;
  }
  .relic-card {
    flex: 1;
    background: linear-gradient(180deg, #181a22 0%, #101218 100%);
    border: 1px solid #c4a46c;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.12s, box-shadow 0.12s;
    text-align: left;
  }
  .relic-card:active {
    transform: scale(0.95);
  }
  .relic-card h4 {
    color: #f0dbb0;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .relic-card p {
    color: #a6aab5;
    font-size: 12px;
    line-height: 1.35;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="top-row">
    <div class="player-stats">
      <div class="meta-row">
        <span>ПЕПЕЛЬНЫЙ СТРАЖ</span>
        <span id="hp-txt">100 / 100</span>
      </div>
      <div class="hp-bar-wrap">
        <div id="hp-Lag"></div>
        <div id="hp-Fill"></div>
      </div>
      <div class="meta-row">
        <span id="atk-txt">УРОН: 22</span>
        <span id="souls-txt">ПЕПЕЛ: 0</span>
      </div>
      <div class="relics-bar" id="relics-list"></div>
    </div>

    <div class="room-badge">
      <div class="room-title" id="room-name">ЗАЛ I — ЦИТАДЕЛЬ ПЕПЛА</div>
      <div class="room-sub" id="room-status">Врагов осталось: 0</div>
    </div>
  </div>

  <div class="controls-row">
    <div id="stick-zone">
      <div class="stick-base"></div>
      <div id="stick-knob"></div>
    </div>

    <div class="action-buttons">
      <div class="act-btn" id="btn-use">ВЗЯТЬ</div>
      <div class="act-btn" id="btn-dash">РЫВОК</div>
      <div class="act-btn" id="btn-jmp">ПРЫЖОК</div>
      <div class="act-btn" id="btn-atk">УДАР</div>
    </div>
  </div>
</div>

<!-- ВЫБОР РЕЛИКВИИ -->
<div id="relic-modal">
  <div class="modal-title">АЛТАРЬ ПРЕДКОВ</div>
  <div class="modal-sub">Выбери один дар, который изменит твой клинок в этом забеге</div>
  <div class="cards-row" id="cards-container"></div>
</div>

<script>
// =====================================================
// 1. СИНТЕЗАТОР ЗВУКА (МРАЧНЫЙ СЛЭШЕР: МЕТАЛЛ, УДАРЫ, РЫВКИ)
// =====================================================
class AudioEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  slash(comboStep = 1) {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    const baseFreq = comboStep === 3 ? 190 : (comboStep === 2 ? 320 : 260);
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(65, now + 0.11);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.12);
  }
  hit(isCrit = false) {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = isCrit ? 'square' : 'triangle';
    osc.frequency.setValueAtTime(isCrit ? 160 : 120, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.16);
    gain.gain.setValueAtTime(isCrit ? 0.32 : 0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.17);
  }
  jump() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(360, now + 0.09);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }
  dash() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.14);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.15);
  }
}
const sfx = new AudioEngine();

// =====================================================
// 2. БАЗА РЕЛИКВИЙ РОГАЛИКА
// =====================================================
const RELIC_POOL = [
  { id: 'vamp', name: 'Окровавленный клык', desc: '+4 HP при каждом убийстве врага клинком.', apply: (p) => { p.vampOnKill += 4; } },
  { id: 'crit', name: 'Обсидиановая грань', desc: '+25% к шансу критического удара (x1.8 урона).', apply: (p) => { p.critChance += 0.25; } },
  { id: 'heavy', name: 'Печать Палача', desc: 'Урон меча +30%, радиус взмаха +15%.', apply: (p) => { p.dmg = Math.round(p.dmg * 1.3); p.rangeBonus += 14; } },
  { id: 'swift', name: 'Ртутная поступь', desc: 'Скорость бега +20%, откат рывка быстрее на 35%.', apply: (p) => { p.moveSpeed *= 1.2; p.dashCdMax *= 0.65; } },
  { id: 'vital', name: 'Сердце Гаргульи', desc: 'Макс. HP +40 и мгновенное исцеление на 40 HP.', apply: (p) => { p.maxHp += 40; p.hp = Math.min(p.maxHp, p.hp + 40); } },
  { id: 'shock', name: 'Грозовой пепел', desc: 'Третий удар комбо бьёт молнией по соседним врагам.', apply: (p) => { p.chainLightning = true; } }
];

// =====================================================
// 3. НАСТРОЙКА ХОЛСТА И КАМЕРЫ
// =====================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Виртуальный масштаб (чтобы на любом экране смартфона обзор был одинаковым)
const VIEW_H = 520;

// =====================================================
// 4. ВВОД: ТАЧСКРИН + КЛАВИАТУРА
// =====================================================
const input = {
  x: 0, y: 0,
  jumpHeld: false,
  jumpBuffer: 0,
  atkBuffered: false,
  dashBuffered: false,
  usePressed: false
};

// Левый стик
const stickZone = document.getElementById('stick-zone');
const stickKnob = document.getElementById('stick-knob');
let stickTouchId = null;

stickZone.addEventListener('pointerdown', (e) => {
  stickTouchId = e.pointerId;
  updateStick(e);
});
window.addEventListener('pointermove', (e) => {
  if (e.pointerId === stickTouchId) updateStick(e);
});
function releaseStick(e) {
  if (e.pointerId === stickTouchId) {
    stickTouchId = null;
    input.x = 0; input.y = 0;
    stickKnob.style.transform = `translate(-50%, -50%)`;
  }
}
window.addEventListener('pointerup', releaseStick);
window.addEventListener('pointercancel', releaseStick);

function updateStick(e) {
  const rect = stickZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const maxR = 46;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, maxR);
  const ang = Math.atan2(dy, dx);
  const kx = Math.cos(ang) * clamped;
  const ky = Math.sin(ang) * clamped;
  stickKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;

  const nx = kx / maxR;
  const ny = ky / maxR;
  input.x = Math.abs(nx) > 0.18 ? Math.sign(nx) * Math.min(1, (Math.abs(nx) - 0.15) / 0.7) : 0;
  input.y = Math.abs(ny) > 0.35 ? Math.sign(ny) : 0;
}

// Правые кнопки слэшера
function bindBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.classList.add('pressed');
    onDown();
  });
  const end = () => {
    el.classList.remove('pressed');
    if (onUp) onUp();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
}

bindBtn('btn-jmp', () => { input.jumpHeld = true; input.jumpBuffer = 0.15; }, () => { input.jumpHeld = false; });
bindBtn('btn-atk', () => { input.atkBuffered = true; });
bindBtn('btn-dash', () => { input.dashBuffered = true; });
bindBtn('btn-use', () => { input.usePressed = true; });

// Клавиатура (для отладки)
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.x = -1;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') input.x = 1;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') input.y = 1;
  if (e.code === 'Space' || e.code === 'KeyW') {
    if (!input.jumpHeld) input.jumpBuffer = 0.15;
    input.jumpHeld = true;
  }
  if (e.code === 'KeyJ' || e.code === 'KeyK') input.atkBuffered = true;
  if (e.code === 'ShiftLeft' || e.code === 'KeyL') input.dashBuffered = true;
  if (e.code === 'KeyE') input.usePressed = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') if (input.x < 0) input.x = 0;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') if (input.x > 0) input.x = 0;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') input.y = 0;
  if (e.code === 'Space' || e.code === 'KeyW') input.jumpHeld = false;
});

// =====================================================
// 5. ИГРОВОЙ МИР, ПРОЦЕДУРНАЯ ГЕНЕРАЦИЯ ЗАЛОВ И ЧАСТИЦ
// =====================================================
let hitstopTimer = 0; // микро-пауза при попадании мечом (Game Feel!)
const cam = { x: 0, y: 0, shake: 0 };

const player = {
  x: 160, y: 300, w: 28, h: 48,
  vx: 0, vy: 0,
  facing: 1,
  grounded: false,
  coyoteTimer: 0,
  wallDir: 0,
  moveSpeed: 330,
  hp: 100, maxHp: 100,
  dmg: 22,
  critChance: 0.15,
  vampOnKill: 0,
  rangeBonus: 0,
  chainLightning: false,
  souls: 0,
  relics: [],
  // Боёвка и стейты
  comboStep: 0,
  comboWindow: 0,
  atkTimer: 0,
  downSmash: false,
  dashTimer: 0,
  dashCd: 0,
  dashCdMax: 0.65,
  invuln: 0,
  scarf: [] // физический развевающийся плащ/шарф
};
for (let i = 0; i < 7; i++) player.scarf.push({ x: player.x, y: player.y });

let roomIndex = 1;
let platforms = [];
let enemies = [];
let particles = [];
let slashArcs = [];
let floatTexts = [];
let shrine = null;
let portal = null;
let bgPillars = [];

function spawnParticles(x, y, color, count = 12, speed = 220, gravity = 500) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.3 + Math.random() * 0.8) * speed;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 60,
      size: 2.5 + Math.random() * 4,
      color,
      gravity,
      life: 0.35 + Math.random() * 0.35,
      maxLife: 0.7
    });
  }
}

function addFloatText(x, y, text, color = '#f5efe6', big = false) {
  floatTexts.push({ x, y, text, color, big, vy: -90, life: 0.75 });
}

// Процедурный генератор зала (платформы, стены для паркура, враги, святилище)
function generateRoom(num) {
  roomIndex = num;
  platforms = [];
  enemies = [];
  particles = [];
  slashArcs = [];
  bgPillars = [];

  const roomW = 1900 + num * 180;
  const floorY = 460;

  // Основной каменный пол и потолок/стены по краям
  platforms.push({ x: -120, y: floorY, w: roomW + 240, h: 180, type: 'solid' });
  platforms.push({ x: -120, y: -300, w: 120, h: 900, type: 'wall' });
  platforms.push({ x: roomW, y: -300, w: 120, h: 900, type: 'wall' });

  // Фоновые готические колонны
  for (let x = 150; x < roomW; x += 260) {
    bgPillars.push({ x, w: 48 + (x % 30), h: 520 });
  }

  // Генерация паркур-секций, башен для Wall-Jump и платформ
  let cursorX = 280;
  while (cursorX < roomW - 380) {
    const pat = Math.floor(Math.random() * 3);
    if (pat === 0) {
      // Двухуровневые платформы
      platforms.push({ x: cursorX, y: floorY - 115, w: 190, h: 22, type: 'plat' });
      platforms.push({ x: cursorX + 90, y: floorY - 235, w: 160, h: 22, type: 'plat' });
      spawnEnemyAt(cursorX + 95, floorY - 115, num);
      cursorX += 340;
    } else if (pat === 1) {
      // Каменная колонна для отскока от стен (Wall Jump)
      platforms.push({ x: cursorX + 40, y: floorY - 250, w: 44, h: 250, type: 'wall' });
      platforms.push({ x: cursorX + 160, y: floorY - 210, w: 170, h: 22, type: 'plat' });
      spawnEnemyAt(cursorX + 230, floorY - 210, num);
      cursorX += 390;
    } else {
      // Арена с надстройкой
      platforms.push({ x: cursorX, y: floorY - 145, w: 250, h: 24, type: 'plat' });
      spawnEnemyAt(cursorX + 120, floorY - 145, num);
      spawnEnemyAt(cursorX + 180, floorY, num);
      cursorX += 360;
    }
    // Враги на первом ярусе
    if (Math.random() < 0.85) spawnEnemyAt(cursorX - 120, floorY, num);
  }

  // Алтарь реликвии в середине зала
  shrine = {
    x: Math.floor(roomW * 0.48),
    y: floorY,
    used: false
  };

  // Врата в следующий зал в конце уровня
  portal = {
    x: roomW - 140,
    y: floorY
  };

  player.x = 110;
  player.y = floorY - player.h;
  player.vx = 0; player.vy = 0;
  updateHUD();
}

function spawnEnemyAt(x, groundY, level) {
  const types = ['stalker', 'warden', 'wraith'];
  const type = types[Math.floor(Math.random() * types.length)];
  const isWarden = type === 'warden';
  const isWraith = type === 'wraith';

  const w = isWarden ? 38 : 28;
  const h = isWarden ? 56 : (isWraith ? 42 : 46);
  const maxHp = Math.round((isWarden ? 95 : (isWraith ? 55 : 65)) * (1 + (level - 1) * 0.25));

  enemies.push({
    type,
    x, y: groundY - h, w, h,
    vx: 0, vy: 0,
    hp: maxHp, maxHp,
    dmg: Math.round((isWarden ? 24 : 15) * (1 + (level - 1) * 0.18)),
    facing: -1,
    state: 'patrol',
    timer: 0,
    atkCooldown: 0,
    flashTimer: 0
  });
}

// =====================================================
// 6. БОЕВАЯ СИСТЕМА И РЕЛИКВИИ
// =====================================================
function performAttack() {
  input.atkBuffered = false;

  // Удар в падении (Down-Smash), если в воздухе зажат стик вниз
  if (!player.grounded && input.y > 0.4) {
    player.downSmash = true;
    player.vy = 680;
    player.atkTimer = 0.35;
    sfx.slash(3);
    return;
  }

  if (player.comboWindow > 0) {
    player.comboStep = (player.comboStep % 3) + 1;
  } else {
    player.comboStep = 1;
  }

  const isFinisher = player.comboStep === 3;
  player.atkTimer = isFinisher ? 0.24 : 0.16;
  player.comboWindow = 0.52;

  // Выпад вперёд при взмахе
  player.vx = player.facing * (isFinisher ? 340 : 190);
  sfx.slash(player.comboStep);

  const reach = (isFinisher ? 78 : 60) + player.rangeBonus;
  const hitX = player.facing === 1 ? player.x + player.w * 0.5 : player.x + player.w * 0.5 - reach;
  const hitY = player.y - 8;
  const hitW = reach;
  const hitH = player.h + 16;

  // Дуга взмаха для рендера
  slashArcs.push({
    x: player.x + player.w / 2,
    y: player.y + player.h / 2,
    dir: player.facing,
    step: player.comboStep,
    radius: reach,
    life: 0.16,
    maxLife: 0.16
  });

  // Проверка попадания по врагам
  let hitAny = false;
  enemies.forEach(e => {
    if (rectOverlap(hitX, hitY, hitW, hitH, e.x, e.y, e.w, e.h)) {
      hitAny = true;
      const isCrit = isFinisher || Math.random() < player.critChance;
      const dmg = Math.round(player.dmg * (isFinisher ? 1.45 : 1.0) * (isCrit ? 1.75 : 1.0));
      damageEnemy(e, dmg, player.facing * (isFinisher ? 340 : 210), isCrit);

      // Цепная молния от реликвии
      if (isFinisher && player.chainLightning) {
        enemies.forEach(other => {
          if (other !== e && Math.hypot(other.x - e.x, other.y - e.y) < 220) {
            damageEnemy(other, Math.round(dmg * 0.6), player.facing * 150, false, '#6ab0e8');
          }
        });
      }
    }
  });

  if (hitAny) {
    hitstopTimer = isFinisher ? 0.065 : 0.035;
    cam.shake = isFinisher ? 9 : 4.5;
    if (navigator.vibrate) navigator.vibrate(isFinisher ? 35 : 15);
  }
}

function damageEnemy(e, dmg, knockVx, isCrit, customColor = null) {
  e.hp -= dmg;
  e.vx = knockVx;
  e.vy = -140;
  e.flashTimer = 0.12;
  // Сбиваем замах обычным врагам
  if (e.type !== 'warden' || isCrit) e.state = 'stagger';
  e.timer = 0.22;

  sfx.hit(isCrit);
  spawnParticles(e.x + e.w / 2, e.y + e.h / 2, customColor || (isCrit ? '#ffbe42' : '#d93848'), isCrit ? 18 : 10, 280);
  addFloatText(e.x + e.w / 2, e.y - 6, isCrit ? `${dmg}!` : `${dmg}`, isCrit ? '#ffbe42' : '#f5efe6', isCrit);

  if (e.hp <= 0) {
    spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#9e1b28', 24, 340);
    player.souls += e.type === 'warden' ? 25 : 12;
    if (player.vampOnKill > 0) {
      player.hp = Math.min(player.maxHp, player.hp + player.vampOnKill);
      addFloatText(player.x, player.y - 12, `+${player.vampOnKill} HP`, '#68e09c');
    }
  }
}

function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Модальное окно выбора реликвии у Алтаря
const relicModal = document.getElementById('relic-modal');
const cardsContainer = document.getElementById('cards-container');
let pausedForModal = false;

function openRelicModal() {
  pausedForModal = true;
  cardsContainer.innerHTML = '';
  const shuffled = [...RELIC_POOL].sort(() => Math.random() - 0.5).slice(0, 3);
  shuffled.forEach(rel => {
    const card = document.createElement('div');
    card.className = 'relic-card';
    card.innerHTML = `<h4>${rel.name}</h4><p>${rel.desc}</p>`;
    card.onclick = () => {
      rel.apply(player);
      player.relics.push(rel.name);
      shrine.used = true;
      pausedForModal = false;
      relicModal.style.display = 'none';
      spawnParticles(shrine.x, shrine.y - 30, '#c4a46c', 25, 260);
      updateHUD();
    };
    cardsContainer.appendChild(card);
  });
  relicModal.style.display = 'flex';
}

// =====================================================
// 7. ФИЗИКА И ОБНОВЛЕНИЕ СОСТОЯНИЯ
// =====================================================
const GRAVITY = 1550;

function update(dt) {
  if (pausedForModal) return;
  if (hitstopTimer > 0) {
    hitstopTimer -= dt;
    return;
  }

  // Таймеры игрока
  if (input.jumpBuffer > 0) input.jumpBuffer -= dt;
  if (player.coyoteTimer > 0) player.coyoteTimer -= dt;
  if (player.atkTimer > 0) player.atkTimer -= dt;
  if (player.comboWindow > 0) player.comboWindow -= dt;
  if (player.dashTimer > 0) player.dashTimer -= dt;
  if (player.dashCd > 0) player.dashCd -= dt;
  if (player.invuln > 0) player.invuln -= dt;

  // 1. Рывок сквозь врагов (Dash с i-frames)
  if (input.dashBuffered && player.dashCd <= 0 && player.dashTimer <= 0) {
    input.dashBuffered = false;
    player.dashTimer = 0.18;
    player.dashCd = player.dashCdMax;
    player.invuln = 0.24;
    player.downSmash = false;
    if (input.x !== 0) player.facing = Math.sign(input.x);
    player.vx = player.facing * 690;
    player.vy = 0;
    sfx.dash();
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#c4a46c', 10, 160, 0);
  }
  input.dashBuffered = false;

  // 2. Атака
  if (input.atkBuffered && player.atkTimer <= 0 && player.dashTimer <= 0) {
    performAttack();
  }

  // 3. Горизонтальное движение
  if (player.dashTimer <= 0 && player.atkTimer <= 0) {
    if (input.x !== 0) {
      player.facing = Math.sign(input.x);
      const targetVx = input.x * player.moveSpeed;
      player.vx += (targetVx - player.vx) * Math.min(1, dt * 18);
    } else {
      player.vx *= Math.pow(0.001, dt);
    }
  } else if (player.atkTimer > 0 && !player.downSmash) {
    player.vx *= Math.pow(0.02, dt);
  }

  // 4. Гравитация и скольжение по стенам
  if (player.dashTimer <= 0) {
    let g = GRAVITY;
    // Если отпустил кнопку прыжка на взлёте — режем высоту (Variable Jump)
    if (player.vy < 0 && !input.jumpHeld) g *= 2.35;
    if (player.vy > 0) g *= 1.25;
    player.vy += g * dt;

    // Замедленное скольжение по стене (Wall Slide)
    if (player.wallDir !== 0 && !player.grounded && player.vy > 110 && Math.sign(input.x) === player.wallDir) {
      player.vy = 110;
      if (Math.random() < 0.35) {
        spawnParticles(player.x + (player.wallDir > 0 ? player.w : 0), player.y + 15, '#7a7e8a', 1, 40, 100);
      }
    }
  }

  // 5. Прыжок (обычный с Coyote Time ИЛИ отскок от стены Wall Jump)
  if (input.jumpBuffer > 0) {
    if (player.coyoteTimer > 0) {
      player.vy = -560;
      player.grounded = false;
      player.coyoteTimer = 0;
      input.jumpBuffer = 0;
      sfx.jump();
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#9296a0', 7, 120, 200);
    } else if (player.wallDir !== 0 && !player.grounded) {
      // Отскок от стены!
      player.vy = -530;
      player.vx = -player.wallDir * 420;
      player.facing = -player.wallDir;
      player.wallDir = 0;
      input.jumpBuffer = 0;
      sfx.jump();
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#c4a46c', 9, 160, 200);
    }
  }

  // 6. Перемещение и коллизии с платформами/стенами
  player.x += player.vx * dt;
  player.wallDir = 0;
  for (const p of platforms) {
    if (p.type !== 'plat' && rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) {
        player.x = p.x - player.w;
        player.wallDir = 1;
      } else if (player.vx < 0) {
        player.x = p.x + p.w;
        player.wallDir = -1;
      }
      player.vx = 0;
    }
  }

  const prevBottom = player.y + player.h;
  player.y += player.vy * dt;
  player.grounded = false;

  for (const p of platforms) {
    if (p.type === 'plat') {
      // Полупрозрачная платформа (можно запрыгнуть снизу или спрыгнуть вниз)
      if (player.vy >= 0 && prevBottom <= p.y + 10 && !(input.y > 0.55) &&
          rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
        landOn(p.y);
      }
    } else if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy > 0) {
        landOn(p.y);
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  function landOn(surfaceY) {
    player.y = surfaceY - player.h;
    if (player.downSmash) {
      // Взрывная волна при приземлении с ударом в падении!
      player.downSmash = false;
      cam.shake = 11;
      sfx.hit(true);
      spawnParticles(player.x + player.w / 2, surfaceY, '#e05364', 24, 340);
      enemies.forEach(e => {
        if (Math.abs((e.x + e.w / 2) - (player.x + player.w / 2)) < 135 && Math.abs((e.y + e.h) - surfaceY) < 60) {
          damageEnemy(e, Math.round(player.dmg * 1.6), Math.sign(e.x - player.x) * 320, true);
        }
      });
    }
    player.vy = 0;
    player.grounded = true;
    player.coyoteTimer = 0.12;
  }

  // Физика шарфа за спиной героя
  let leadX = player.x + player.w / 2 - player.facing * 6;
  let leadY = player.y + 10;
  player.scarf.forEach((node, idx) => {
    node.x += (leadX - node.x - player.facing * 5) * Math.min(1, dt * (22 - idx * 2));
    node.y += (leadY - node.y + Math.sin(performance.now() * 0.015 + idx) * 2) * Math.min(1, dt * 18);
    leadX = node.x; leadY = node.y;
  });

  // 7. Обновление врагов (ИИ, телеграф атаки, удары)
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) {
      enemies.splice(i, 1);
      continue;
    }
    if (e.flashTimer > 0) e.flashTimer -= dt;
    if (e.atkCooldown > 0) e.atkCooldown -= dt;

    const dx = (player.x + player.w / 2) - (e.x + e.w / 2);
    const dy = (player.y + player.h / 2) - (e.y + e.h / 2);
    const dist = Math.hypot(dx, dy);

    if (e.state === 'stagger') {
      e.timer -= dt;
      e.vx *= Math.pow(0.01, dt);
      if (e.timer <= 0) e.state = 'chase';
    } else if (e.state === 'windup') {
      // Фаза замаха (жёлтая/алая вспышка перед ударом — время для переката!)
      e.vx *= 0.85;
      e.timer -= dt;
      if (e.timer <= 0) {
        e.state = 'strike';
        e.timer = 0.16;
        e.vx = e.facing * (e.type === 'warden' ? 360 : 440);
        // Проверка урона игроку
        if (Math.abs(dx) < (e.type === 'warden' ? 75 : 58) && Math.abs(dy) < 52) {
          hurtPlayer(e.dmg, e.facing * 280);
        }
      }
    } else if (e.state === 'strike') {
      e.timer -= dt;
      if (e.timer <= 0) {
        e.state = 'chase';
        e.atkCooldown = e.type === 'warden' ? 1.15 : 0.75;
      }
    } else {
      // Преследование игрока
      if (dist < 420) {
        e.facing = dx >= 0 ? 1 : -1;
        const spd = e.type === 'warden' ? 115 : (e.type === 'wraith' ? 210 : 165);
        if (Math.abs(dx) > 44) {
          e.vx += (e.facing * spd - e.vx) * dt * 8;
        } else if (e.atkCooldown <= 0 && Math.abs(dy) < 55) {
          e.state = 'windup';
          e.timer = e.type === 'warden' ? 0.48 : 0.34; // честное окно для уклонения!
        }
      } else {
        e.vx *= 0.9;
      }
    }

    // Физика врага
    if (e.type !== 'wraith') {
      e.vy += GRAVITY * dt;
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      for (const p of platforms) {
        if (e.vy >= 0 && rectOverlap(e.x, e.y, e.w, e.h, p.x, p.y, p.w, p.h)) {
          e.y = p.y - e.h;
          e.vy = 0;
        }
      }
    } else {
      // Призрак парит по воздуху напрямую к герою
      e.x += e.vx * dt;
      const targetY = player.y - 6;
      e.y += (targetY - e.y) * dt * 2.5;
    }
  }

  // 8. Проверка интерактивных объектов (Алтарь и Врата)
  const useBtn = document.getElementById('btn-use');
  const nearShrine = shrine && !shrine.used && Math.hypot(player.x - shrine.x, (player.y + player.h) - shrine.y) < 75;
  const nearPortal = portal && enemies.length === 0 && Math.hypot(player.x - portal.x, (player.y + player.h) - portal.y) < 85;

  if (nearShrine || nearPortal) {
    useBtn.style.display = 'flex';
    useBtn.textContent = nearShrine ? 'ДАР' : 'ВРАТА';
    if (input.usePressed) {
      input.usePressed = false;
      if (nearShrine) openRelicModal();
      else if (nearPortal) generateRoom(roomIndex + 1);
    }
  } else {
    useBtn.style.display = 'none';
    input.usePressed = false;
  }

  // 9. Частицы, дуги меча и всплывающие цифры
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.vy += pt.gravity * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = slashArcs.length - 1; i >= 0; i--) {
    slashArcs[i].life -= dt;
    if (slashArcs[i].life <= 0) slashArcs.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }

  // Плавная камера с упреждением по взгляду героя
  const scale = H / VIEW_H;
  const viewW = W / scale;
  const targetCamX = player.x + player.w / 2 + player.facing * 65 - viewW / 2;
  const targetCamY = player.y - VIEW_H * 0.58;
  cam.x += (targetCamX - cam.x) * Math.min(1, dt * 8);
  cam.y += (targetCamY - cam.y) * Math.min(1, dt * 6);
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 28);

  updateHUD();
}

function hurtPlayer(dmg, knockVx) {
  if (player.invuln > 0) return;
  player.hp -= dmg;
  player.invuln = 0.65;
  player.vx = knockVx;
  player.vy = -210;
  cam.shake = 12;
  sfx.hit(true);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#d93848', 18, 260);
  addFloatText(player.x + player.w / 2, player.y - 10, `-${dmg}`, '#ff4d5e', true);
  if (navigator.vibrate) navigator.vibrate(100);

  if (player.hp <= 0) {
    // Возрождение в Зале I (рогалик-цикл)
    player.hp = 100; player.maxHp = 100;
    player.dmg = 22; player.critChance = 0.15;
    player.vampOnKill = 0; player.rangeBonus = 0;
    player.chainLightning = false;
    player.relics = [];
    player.souls = 0;
    generateRoom(1);
  }
}

function updateHUD() {
  const pct = Math.max(0, (player.hp / player.maxHp) * 100);
  document.getElementById('hp-Fill').style.width = `${pct}%`;
  document.getElementById('hp-Lag').style.width = `${pct}%`;
  document.getElementById('hp-txt').textContent = `${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`;
  document.getElementById('atk-txt').textContent = `УРОН: ${player.dmg}`;
  document.getElementById('souls-txt').textContent = `ПЕПЕЛ: ${player.souls}`;
  document.getElementById('room-name').textContent = `ЗАЛ ${roomIndex} — ЦИТАДЕЛЬ ПЕПЛА`;
  document.getElementById('room-status').textContent = enemies.length > 0
    ? `Врагов в зале: ${enemies.length}`
    : `Зал очищен — Врата открыты!`;
  document.getElementById('relics-list').innerHTML = player.relics.map(r => `<span class="relic-tag">${r}</span>`).join('');
}

// =====================================================
// 8. ОТРИСОВКА МИРА (ГОТИЧЕСКИЙ СЕРЫЙ ФЭНТЕЗИ-РЕНДЕР)
// =====================================================
function render() {
  ctx.fillStyle = '#0b0c10';
  ctx.fillRect(0, 0, W, H);

  const scale = H / VIEW_H;
  ctx.save();
  ctx.scale(scale, scale);

  const sx = (Math.random() - 0.5) * cam.shake;
  const sy = (Math.random() - 0.5) * cam.shake;
  ctx.translate(-cam.x + sx, -cam.y + sy);

  // 1. Параллакс-колонны на фоне
  ctx.fillStyle = '#12141c';
  bgPillars.forEach(b => {
    const px = b.x + cam.x * 0.25;
    ctx.fillRect(px, 40, b.w, b.h);
    ctx.fillStyle = '#191c26';
    ctx.fillRect(px + 6, 40, 8, b.h);
    ctx.fillStyle = '#12141c';
  });

  // 2. Алтарь реликвий
  if (shrine) {
    ctx.fillStyle = shrine.used ? '#2b2d38' : '#c4a46c';
    ctx.beginPath();
    ctx.moveTo(shrine.x - 18, shrine.y);
    ctx.lineTo(shrine.x, shrine.y - 54);
    ctx.lineTo(shrine.x + 18, shrine.y);
    ctx.closePath();
    ctx.fill();
    if (!shrine.used) {
      ctx.fillStyle = 'rgba(196, 164, 108, 0.22)';
      ctx.beginPath();
      ctx.arc(shrine.x, shrine.y - 32, 34 + Math.sin(performance.now() * 0.006) * 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 3. Врата в следующий зал
  if (portal) {
    const active = enemies.length === 0;
    ctx.strokeStyle = active ? '#68e09c' : '#3a3d4a';
    ctx.lineWidth = 5;
    ctx.strokeRect(portal.x - 24, portal.y - 76, 48, 76);
    if (active) {
      ctx.fillStyle = 'rgba(104, 224, 156, 0.25)';
      ctx.fillRect(portal.x - 20, portal.y - 72, 40, 72);
    }
  }

  // 4. Платформы и каменная кладка
  platforms.forEach(p => {
    ctx.fillStyle = p.type === 'plat' ? '#2c303d' : '#181a22';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = p.type === 'plat' ? '#687089' : '#35394a';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  });

  // 5. Враги
  enemies.forEach(e => {
    ctx.save();
    // Телеграф замаха перед атакой!
    if (e.state === 'windup') {
      ctx.fillStyle = 'rgba(255, 190, 66, 0.35)';
      ctx.beginPath();
      ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = e.flashTimer > 0
      ? '#ffffff'
      : (e.type === 'warden' ? '#6e222e' : (e.type === 'wraith' ? '#4a6b82' : '#4a3b4e'));
    ctx.fillRect(e.x, e.y, e.w, e.h);

    // Горящий глаз врага
    ctx.fillStyle = e.state === 'windup' ? '#ffbe42' : '#ff334b';
    const eyeX = e.facing === 1 ? e.x + e.w - 8 : e.x + 4;
    ctx.fillRect(eyeX, e.y + 10, 5, 5);

    // Полоска HP над врагом
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#1a1416';
      ctx.fillRect(e.x - 4, e.y - 10, e.w + 8, 5);
      ctx.fillStyle = '#d93848';
      ctx.fillRect(e.x - 4, e.y - 10, (e.w + 8) * (e.hp / e.maxHp), 5);
    }
    ctx.restore();
  });

  // 6. Развевающийся шарф и сам Пепельный Страж
  ctx.strokeStyle = '#b82838';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  player.scarf.forEach((n, idx) => {
    if (idx === 0) ctx.moveTo(n.x, n.y);
    else ctx.lineTo(n.x, n.y);
  });
  ctx.stroke();

  ctx.save();
  if (player.invuln > 0 && Math.floor(performance.now() / 45) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }
  // Плащ и броня героя
  ctx.fillStyle = player.dashTimer > 0 ? '#f0dbb0' : '#d8d4cc';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // Визор шлема
  ctx.fillStyle = '#00f3ff';
  const visorX = player.facing === 1 ? player.x + player.w - 9 : player.x + 2;
  ctx.fillRect(visorX, player.y + 9, 7, 4);
  ctx.restore();

  // 7. Дуги рассечения мечом (Slash Trails)
  slashArcs.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(s.dir, 1);
    const alpha = s.life / s.maxLife;
    ctx.strokeStyle = s.step === 3 ? `rgba(255, 190, 66, ${alpha})` : `rgba(240, 245, 255, ${alpha})`;
    ctx.lineWidth = s.step === 3 ? 14 : 9;
    ctx.beginPath();
    if (s.step === 2) {
      ctx.arc(0, 0, s.radius * 0.78, Math.PI * 0.65, -Math.PI * 0.55, true);
    } else {
      ctx.arc(0, 0, s.radius * 0.78, -Math.PI * 0.55, Math.PI * 0.55, false);
    }
    ctx.stroke();
    ctx.restore();
  });

  // 8. Частицы и цифры урона
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  });
  ctx.globalAlpha = 1;

  floatTexts.forEach(ft => {
    ctx.font = ft.big ? '900 18px sans-serif' : '700 14px sans-serif';
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  });

  ctx.restore();
}

// Старт игры
generateRoom(1);
let prev = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - prev) / 1000);
  prev = now;
  update(dt);
  render();
}
requestAnimationFrame(loop);
</script>
</body>
